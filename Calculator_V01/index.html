<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Calculator</title>
    <link rel="stylesheet" href="styles.css">
    <script src="script.js" defer></script>
</head>
<body>
    <div class="container">
        <div class="outer">
            <div class="screen">
                <div class="input_screen"></div>
                <div class="outer_screen">
                    <div class="result"></div>
                    <div class="brand">hello</div>
                </div>
            </div>
             <div class="buttons">
                     <div class="button" id="one"></div>
                     <div class="button" id="two"></div>
                     <div class="button" id="three"></div>
                     <div class="button" id="four"></div>
                     <div class="button" id="five"></div>
                     <div class="button" id="six"></div>
                     <div class="button" id="seven"></div>
                     <div class="button" id="eight"></div>
                     <div class="button" id="nine"></div>
                     <div class="button" id="zero"></div>
                     <div class="button" id="decimal"></div>
                     <div class="button" id="sum"></div>
                     <div class="button" id="sub"></div>
                     <div class="button" id="multi"></div>
                     <div class="button" id="divide"></div>
                     <div class="button" id="equal"></div>
            </div>
        </div>
    </div>
</body>
</html>
