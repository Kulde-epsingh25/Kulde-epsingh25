<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Calculator</title>
    <link rel="stylesheet" href="styles.css">
    <script src="script.js" defer></script>
</head>

<body>
    <div class="container">
        <div class="outer">
            <div class="screen">
                <div class="input_screen">
                    <span id="input"></span>
                </div>
                <div class="outer_screen">
                    <div class="result"><span id="result"></span></div>
                    <div class="brand"><span>𝓕𝓧09</span></div>
                </div>
            </div>
            <div class="button_container">
                <ul class="buttons">
                    <li class="button" id="1"><span>1</span></li>
                    <li class="button" id="2"><span>2</span></li>
                    <li class="button" id="3"><span>3</span></li>
                    <li class="button" id="+"><span>+</span></li>
                    <li class="button" id="4"><span>4</span></li>
                    <li class="button" id="5"><span>5</span></li>
                    <li class="button" id="6"><span>6</span></li>
                    <li class="button" id="-"><span>-</span></li>
                    <li class="button" id="7"><span>7</span></li>
                    <li class="button" id="8"><span>8</span></li>
                    <li class="button" id="9"><span>9</span></li>
                    <li class="button" id="*"><span>*</span></li>
                    <li class="button" id="0"><span>0</span></li>
                    <li class="button" id="."><span>.</span></li>
                    <li class="button" id="C"><span>C</span></li>
                    <li class="button" id="/"><span>/</span></li>
                    
                </ul>
            </div>
        </div>
    </div>
</body>

</html>
