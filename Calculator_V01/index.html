<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Calculator</title>
    <link rel="stylesheet" href="styles.css">
    <script src="script.js" defer></script>
</head>

<body>
    <div class="container">
        <div class="outer">
            <div class="screen">
                <div class="input_screen"></div>
                <div class="outer_screen">
                    <div class="result"></div>
                    <div class="brand">hello</div>
                </div>
            </div>
            <div class="buttons">
      
                <ul>
                    <li class="button" id="one"><span>1</span></li>
                    <li class="button" id="two"><span>2</span></li>
                    <li class="button" id="three"><span>3</span></li>
                    <li class="button" id="sum"><span>+</span></li>
                    <li class="button" id="four"><span>4</span></li>
                    <li class="button" id="five"><span>5</span></li>
                    <li class="button" id="six"><span>6</span></li>
                    <li class="button" id="sub"><span>-</span></li>
                    <li class="button" id="seven"><span>7</span></li>
                    <li class="button" id="eight"><span>8</span></li>
                    <li class="button" id="nine"><span>9</span></li>
                    <li class="button" id="multi"><span>*</span></li>
                    <li class="button" id="zero"><span>0</span></li>
                    <li class="button" id="decimal"><span>.</span></li>
                    <li class="button" id="clear"><span>C</span></li>
                    <li class="button" id="divide"><span>/</span></li>
                    
                </ul>
            </div>
        </div>
    </div>
</body>

</html>
