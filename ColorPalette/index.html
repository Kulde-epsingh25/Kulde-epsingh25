<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Color Palette Generator</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>Color Palette Generator</h1>
        <div class="palette">
            <div class="color-box" id="color1">
                <div class="color-info">
                    <span class="color-code">#FFFFFF</span>
                    <i class="fas fa-copy copy-btn" title="Copy to clipboard"></i>
                </div>
            </div>
            <div class="color-box" id="color2">
                <div class="color-info">
                    <span class="color-code">#FFFFFF</span>
                    <i class="fas fa-copy copy-btn" title="Copy to clipboard"></i>
                </div>
            </div>
            <div class="color-box" id="color3">
                <div class="color-info"><span class="color-code">#FFFFFF</span><i class="fas fa-copy copy-btn" title="Copy to clipboard"></i></div>
            </div>
            <div class="color-box" id="color4">
                <div class="color-info"><span class="color-code">#FFFFFF</span><i class="fas fa-copy copy-btn" title="Copy to clipboard"></i></div>
            </div>
            <div class="color-box" id="color5">
                <div class="color-info"><span class="color-code">#FFFFFF</span><i class="fas fa-copy copy-btn" title="Copy to clipboard"></i></div>
            </div>
            </div>
        <button id="generate-btn"><i class="fas fa-sync-alt"></i>Generate New Palette</button>
    </div>
    <script src="script.js"></script>
</body>
</html>
