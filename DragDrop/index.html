<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drag & Drop</title>
    <link class="css" rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
    <h1>Drag & Drop</h1>
    <div class="board">
    <div class="list" id="list1">
        <h2>To do</h2>
        <div class="items">
        <div class="card" draggable="true" >Hello</div>
        </div>  
        <div class="add" id="new-btn">
            +
        </div>
    </div>
    <div class="list" id="list2">
        <h2>In Progress</h2>
        <div class="items"></div>
    </div>
    <div class="list" id="list3">
        <h2>Done</h2>
        <div class="items"></div>
    </div>
    </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
