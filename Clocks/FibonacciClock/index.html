<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <title>Fibonacci Spiral clock with golden ratio</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="panel">
     <div class="scale top-scale"  >
        <div>12</div>
        <div>11</div>
        <div>10</div>
        <div>9</div>
        <div>8</div>
        <div>7</div>
    </div>
    <svg class="spiral" width="400" height="400" viewBox="-130 -130 260 260">
      <path id="spiralPath" fill="none" stroke="white" stroke-width="5" stroke-linecap="round" />
    </svg>
    <div class="scale bottom-scale">
        <div>6</div>
        <div>5</div>
        <div>4</div>
        <div>3</div>
        <div>2</div>
        <div>1</div>
    </div>

  </div>

  <script src="script.js">
  </script>

</body>

</html>
