<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Tracker</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div class="container">
        <h1>Expense Tracker</h1>
        <div class="tracker">
            <h3>Your Balance</h3>
            <h2 id="balance">$0.00</h2>
            <div class="summary">
                <div class="summary-box income">
                    <h3>Income</h3>
                    <p class="amount" id="income">$0.00</p>
                </div>
                <div class="summary-box expense">
                    <h3>Expense</h3>
                    <p class="amount" id="expense">$0.00</p>
                </div>
            </div>
        </div>
        <div class="main-content">
            <div class="transaction-container">
                <h2>Transactions</h2>
                <ul class="transaction-list"></ul>
            </div>
            <div class="form-container">
                <h2>Add New Transaction</h2>
                <form id="transaction-form">
                    <label for="description">Description</label>
                    <input type="text" id="description" placeholder="Description" required>
            
                    <label for="amount">Amount</label>
                    <input type="number" id="amount" placeholder="Amount (negative for expense)" required>
                    
                    <small>Use negative value for expenses</small>
                   
                    <button type="submit">Add Transaction</button>
                </form>
            </div>

        </div>
    </div>  
    <script src="script.js"></script>
</body>

</html>
